<g id="halloween-frame" aria-hidden="true" pointer-events="none">
  <defs>
    <radialGradient id="pumpkin-haze"><stop offset="0" stop-color="#e77720" stop-opacity=".3"/><stop offset="1" stop-color="#a43d0f" stop-opacity="0"/></radialGradient>
    <radialGradient id="blood-haze"><stop offset="0" stop-color="#a22c20" stop-opacity=".3"/><stop offset="1" stop-color="#5c1210" stop-opacity="0"/></radialGradient>
    <image id="halloween-lantern" width="100" height="150" href="{{LANTERN}}"/>
    <image id="halloween-pumpkin" width="100" height="84" href="{{PUMPKIN}}"/>
    <image id="halloween-web" width="180" height="250" href="{{WEB}}"/>
  </defs>
  <ellipse cx="95" cy="170" rx="280" ry="230" fill="url(#pumpkin-haze)"/>
  <ellipse cx="1505" cy="170" rx="280" ry="230" fill="url(#pumpkin-haze)"/>
  <ellipse cx="20" cy="{{MID_Y}}" rx="210" ry="650" fill="url(#blood-haze)"/>
  <ellipse cx="1580" cy="{{MID_Y}}" rx="210" ry="650" fill="url(#pumpkin-haze)"/>
  <g opacity=".6">
    <use href="#halloween-web" transform="translate(-48 -85) rotate(-26 90 125) scale(1.35)"/>
    <use href="#halloween-web" transform="translate(1648 -85) scale(-1.35 1.35) rotate(-26 90 125)"/>
  </g>
  <path d="M111 0 V76 M1489 0 V76" fill="none" stroke="#503b2c" stroke-width="2"/>
  <use href="#halloween-lantern" x="61" y="73"/>
  <use href="#halloween-lantern" x="1439" y="73"/>
  <g opacity=".42">
    <use href="#halloween-web" x="-100" y="540"/>
    <use href="#halloween-web" transform="translate(1700 800) scale(-1 1)"/>
    <use href="#halloween-web" x="-110" y="{{LOW_WEB_Y}}"/>
    <use href="#halloween-web" transform="translate(1710 {{LOW_WEB_Y}}) scale(-1 1)"/>
  </g>
  <g opacity=".78">
    <use href="#halloween-pumpkin" transform="translate(10 905) scale(.58) rotate(-10 50 42)"/>
    <use href="#halloween-pumpkin" transform="translate(1532 1180) scale(.58) rotate(12 50 42)"/>
    <use href="#halloween-lantern" transform="translate(15 {{LOW_LANTERN_Y}}) scale(.48)"/>
    <use href="#halloween-lantern" transform="translate(1537 565) scale(.48)"/>
  </g>
  <g transform="translate(0 {{FOOTER_Y}})">
    <ellipse cx="120" cy="65" rx="210" ry="100" fill="url(#pumpkin-haze)"/>
    <ellipse cx="1480" cy="65" rx="210" ry="100" fill="url(#blood-haze)"/>
    <use href="#halloween-web" transform="translate(-72 -95) rotate(-22 90 125)" opacity=".5"/>
    <use href="#halloween-web" transform="translate(1672 -95) scale(-1 1) rotate(-22 90 125)" opacity=".5"/>
    <use href="#halloween-pumpkin" transform="translate(115 40) scale(.62)"/>
    <use href="#halloween-lantern" transform="translate(48 -8) scale(.7)"/>
    <use href="#halloween-pumpkin" transform="translate(20 55) scale(.5)"/>
    <use href="#halloween-pumpkin" transform="translate(1423 40) scale(.62)"/>
    <use href="#halloween-lantern" transform="translate(1482 -8) scale(.7)"/>
    <use href="#halloween-pumpkin" transform="translate(1530 55) scale(.5)"/>
  </g>
</g>
